apiVersion: v1
kind: LimitRange
metadata:
  name: petclinic-limit-range
  namespace: petclinic-prod
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "50m"
        memory: "128Mi"