apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: petclinic-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB_FILE
              value: /etc/postgres-secrets/postgres.db
            - name: POSTGRES_USER_FILE
              value: /etc/postgres-secrets/postgres.user
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgres-secrets/postgres.password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-secret
              mountPath: /etc/postgres-secrets
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$(cat /etc/postgres-secrets/postgres.user)" -d "$(cat /etc/postgres-secrets/postgres.db)"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$(cat /etc/postgres-secrets/postgres.user)" -d "$(cat /etc/postgres-secrets/postgres.db)"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: postgres-secret
          secret:
            secretName: petclinic-db-secret
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi