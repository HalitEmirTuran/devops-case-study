apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-ingress.yaml
  - app-pdb.yaml
  - app-hpa.yaml
  - app-networkpolicy.yaml
  - postgres-networkpolicy.yaml
  - postgres-backup-pvc.yaml
  - postgres-backup-cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kubectl-kustomize
    includeSelectors: false
    includeTemplates: false